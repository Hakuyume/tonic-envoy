name: cargo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cargo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt -- --check
  cargo-clippy:
    strategy:
      matrix:
        bytes: [false, true]
        pbjson: [false, true]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # https://github.com/actions/cache/blob/master/examples.md#rust---cargo
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get install --no-install-recommends --yes libprotobuf-dev protobuf-compiler
      - run: |
          FEATURES=(
            ${{ matrix.bytes && 'bytes' || '' }}
            ${{ matrix.pbjson && 'pbjson' || '' }}
          )
          cargo clippy --features="${FEATURES[*]}" --locked -- --deny=warnings
