[package]
name = "tonic-envoy"
version = "0.1.0"
edition = "2024"

[features]
bytes = []
pbjson = ["dep:pbjson", "dep:pbjson-build", "dep:pbjson-types"]

[dependencies]
pbjson = { version = "0.9.0", optional = true }
pbjson-types = { version = "0.9.0", optional = true }
prost = "0.14.3"
prost-types = "0.14.3"
serde = "1.0.228"
tonic = { version = "0.14.3", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.3"
tonic-types = "0.14.3"

[build-dependencies]
pbjson-build = { version = "0.9.0", optional = true }
proc-macro2 = "1.0.106"
prost-build = "0.14.3"
quote = "1.0.44"
tonic-prost-build = "0.14.3"
